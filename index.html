<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JastipRijo</title>
    <meta name="description" content="Pesan makanan, minuman, dan snack asli buatan khas manado" />
    <meta name="author" content="Rijo" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#8B4513" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JastipRijo" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/logoR.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logoR.png" />
    <link rel="apple-touch-icon" href="/logoR.png" />

    <meta property="og:title" content="JastipRijo" />
    <meta property="og:description" content="Pesan makanan, minuman, dan snack asli buatan khas manado" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logoR.png" />

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
